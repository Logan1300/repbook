name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # The same signing key is used for every build, so new versions install as updates.
      RB_STORE_PASSWORD: EgXDd2YfB191gvz7pYJto8vd
      RB_KEYSTORE: ${{ github.workspace }}/keystore/repbook-release.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build:native

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/RepBook-${VERSION_NAME}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RepBook-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" out/*.apk \
            --title "RepBook ${VERSION_NAME}" \
            --notes "Download **RepBook-${VERSION_NAME}.apk** below on your Android phone and open it to install or update. Your workouts are kept when you update." \
            --latest
